<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion - Le Bon Refuge</title>
<link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
<div class="login-shell">
  <div class="card login-card">
    <p class="eyebrow">Espace staff</p>
    <h2 style="font-family:var(--font-body); color:var(--paper);">Connexion</h2>
    <form id="formLogin">
      <label>Identifiant</label>
      <input type="text" name="username" autocomplete="username" required autofocus>
      <label>Mot de passe</label>
      <input type="password" name="password" autocomplete="current-password" required>
      <button class="btn btn--block" type="submit">Se connecter</button>
    </form>
    <!--<div class="demo-accounts">
      Comptes fournis par défaut (à changer dans l'espace Admin) :<br>
      admin / admin123 · chef / chef123<br>
      assistant / assistant123 · serveur1 / serveur123
    </div> -->
    <p style="margin-top:1rem;"><a href="/" style="color:var(--text-dim); font-size:0.85rem;">← Retour au site</a></p>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/api.js"></script>
<script>
  document.getElementById('formLogin').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    try {
      const res = await apiPost('/api/auth/login', {
        username: fd.get('username'),
        password: fd.get('password')
      });

      // 1. Détection automatique de la structure (que ce soit res.user ou res directement)
      const userData = res.user || res;

      // 2. Nettoyage du rôle (passage en minuscules et suppression des espaces)
      const role = (userData.role || '').toLowerCase().trim();

      // 3. Mapping des destinations
      const destinations = {
        admin: '/admin.html',
        chef: '/cuisine.html',
        assistant_chef: '/cuisine.html',
        serveur: '/caisse.html',
        superviseur: '/supervision.html'
      };

      // Console log pour vérifier ce qui est reçu lors de la connexion
      console.log("Données utilisateur reçues :", userData);
      console.log("Rôle détecté :", role);

      if (destinations[role]) {
        window.location.href = destinations[role];
      } else {
        console.error("Rôle inconnu :", role);
        toast("Rôle non reconnu : " + role, "error");
      }

    } catch (err) {
      toast(err.message || "Erreur de connexion", 'error');
    }
  });
</script>
</body>
</html>
